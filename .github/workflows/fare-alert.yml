name: Flight fare alert

on:
  schedule:
    - cron: "*/30 * * * *"      # every 30 min (reads Telegram commands); fares checked every CHECK_EVERY_MIN
  workflow_dispatch:            # "Run workflow" button = instant check
    inputs:
      force:
        description: "Force fare check now"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: fare-alert
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check fares & process Telegram commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CHECK_EVERY_MIN: "120"      # fare check every 2 hours
          REALERT_HOURS: "24"         # remind once a day if fare stays below limit
          FORCE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
        run: python fare_bot.py

      - name: Save routes & state
        run: |
          git config user.name  "fare-bot"
          git config user.email "fare-bot@users.noreply.github.com"
          git add routes.json state.json
          git diff --cached --quiet || git commit -m "fare bot update [skip ci]"
          git pull --rebase -q || true
          git push -q
